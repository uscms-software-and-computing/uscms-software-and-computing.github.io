name: CI

on:
  push:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Daily rebuild – also rolls the freshness reports over at each new quarter
  schedule:
  - cron: "0 0 * * *"

permissions:
  contents: write   # the gh-pages deploy pushes to the gh-pages branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Postdoc freshness reports ───────────────────────────────────────
      # Generated into the source tree before the Jekyll build so they are
      # copied into _site and deployed with the rest of the site.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install report dependencies
        run: pip install reportlab

      - name: Generate freshness reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pages/reports
          # Current quarter (live tracking)
          python scripts/postdoc_report.py \
            --token "$GITHUB_TOKEN" \
            --output pages/reports/postdoc_freshness_report.html \
            --pdf
          # Quarter that just ended
          python scripts/postdoc_report.py \
            --token "$GITHUB_TOKEN" \
            --output pages/reports/postdoc_freshness_report_previous.html \
            --pdf --previous

      # ── Site build ──────────────────────────────────────────────────────
      - name: Restore bundle cache
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install apt requirements
        run: |
          sudo apt-get update
          sudo apt-get install libxslt-dev libxml2-dev
          gem install bundler

      - name: Bundle install
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3
        env:
          NOKOGIRI_USE_SYSTEM_LIBRARIES: true

      - uses: limjh16/jekyll-action-ts@v2
        with:
          enable_cache: true

      # ── Deploy ──────────────────────────────────────────────────────────
      # Deploys on push, schedule and manual runs from master
      - name: GitHub Pages action
        if: success() && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3.7.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          allow_empty_commit: true